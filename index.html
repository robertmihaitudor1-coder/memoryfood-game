<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Food Memory 8x8</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🍔 Food Memory</div>

    <div class="stats">
      <div class="pill">Moves: <span id="moves">0</span></div>
      <div class="pill">Time: <span id="time">0:00</span></div>
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Pairs: <span id="pairs">0</span>/<span id="totalPairs">32</span></div>
    </div>

    <div class="actions">
      <button id="newGameBtn">New game</button>
    </div>
  </header>

  <main class="wrap">
    <section id="board" class="board" aria-label="Memory board"></section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="game.js"></script>
</body>
</html>
